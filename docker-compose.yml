# Shared log-rotation policy. Without it every container uses the default
# json-file driver with no cap, so stdout grows unbounded and eventually
# fills the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Infrastructure ──────────────────────────────────────────────────

  mongodb:
    image: mongo:8
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - mongodb_data:/data/db
    networks:
      - foundry
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-foundry}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
        - "127.0.0.1:5432:5432"
    networks:
      - foundry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-foundry}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - foundry
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Audio node for the discord-utils music bots. Internal only - never routed
  # through Traefik.
  #
  # Plugins are re-downloaded from Maven on every boot, deliberately. A named
  # volume on /opt/Lavalink/plugins does NOT work: the image ships no plugins
  # directory, so Docker has no ownership to copy and creates the volume as
  # root:root, while the container runs as uid 322 - the download then dies with
  # "./plugins/youtube-plugin-1.18.2.jar (Permission denied)" and Spring aborts
  # startup. Without the mount, Lavalink creates the directory itself inside its
  # own 322-owned WORKDIR. Two jars take a couple of seconds to fetch.
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      _JAVA_OPTIONS: -Xmx512M
      SERVER_PORT: 2333
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD}
      PLUGINS_LAVASRC_SPOTIFY_CLIENTID: ${SPOTIFY_CLIENT_ID:-}
      PLUGINS_LAVASRC_SPOTIFY_CLIENTSECRET: ${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    networks:
      - foundry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"Authorization: $$LAVALINK_SERVER_PASSWORD\" http://localhost:2333/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Backend ─────────────────────────────────────────────────────────

  api-backend:
    build:
      context: ./api-backend
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped
    logging: *default-logging
    environment:
      VALKEY_URI: ${VALKEY_URI}
      WOM_GROUP_ID: ${WOM_GROUP_ID:-}
      WOM_API_KEY: ${WOM_API_KEY:-}
      WOM_GROUP_KEY: ${WOM_GROUP_KEY:-}
      WOM_CLAN_NAME: ${WOM_CLAN_NAME:-Iron Foundry}
      WOM_DISCORD_CONTACT: ${WOM_DISCORD_CONTACT:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      GUILD_ID: ${GUILD_ID}
      DISCORD_TOKEN: ${DISCORD_SERVER_TOKEN}
      DISCORD_SERVER_TOKEN: ${DISCORD_SERVER_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-foundry}
      DISCORD_PARTY_WEBHOOK_URL: ${DISCORD_PARTY_WEBHOOK_URL:-}
      METRICS_API_KEY: ${METRICS_API_KEY}
      # Track search only. The API resolves queries over Lavalink's REST API so
      # the website can build a playlist with no bot in a voice channel; it
      # never holds a player.
      LAVALINK_URI: http://lavalink:2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - foundry
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ── Discord bots ─────────────────────────────────────────────────────

  discord-server:
    build: ./discord-server
    restart: unless-stopped
    logging: *default-logging
    environment:
      DISCORD_TOKEN: ${DISCORD_SERVER_TOKEN}
      GUILD_ID: ${GUILD_ID}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-foundry}
      VALKEY_URI: ${VALKEY_URI}
      STAFF_ROLE_ID: ${STAFF_ROLE_ID}
      SENIOR_STAFF_ROLE_ID: ${SENIOR_STAFF_ROLE_ID}
      OWNER_ROLE_ID: ${OWNER_ROLE_ID}
      MENTOR_ROLE_ID: ${MENTOR_ROLE_ID}
      TICKET_SUPPORT_ROLE_ID: ${TICKET_SUPPORT_ROLE_ID}
      FRONTEND_URL: ${FRONTEND_URL}
      UPLOADTHING_SECRET: ${UPLOADTHING_SECRET:-}
      API_BACKEND_URL: http://api-backend:8000
      METRICS_API_KEY: ${METRICS_API_KEY}
    networks:
      - foundry
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  discord-utils:
    build: ./discord-utils
    restart: unless-stopped
    logging: *default-logging
    environment:
      DISCORD_TOKEN: ${DISCORD_UTILS_TOKEN}
      GUILD_ID: ${GUILD_ID}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-foundry}
      VALKEY_URI: ${VALKEY_URI}
      STAFF_ROLE_ID: ${STAFF_ROLE_ID}
      SENIOR_STAFF_ROLE_ID: ${SENIOR_STAFF_ROLE_ID}
      LAVALINK_URI: http://lavalink:2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}
      MUSIC_BOT_TOKENS: ${MUSIC_BOT_TOKENS:-}
      API_BACKEND_URL: http://api-backend:8000
      METRICS_API_KEY: ${METRICS_API_KEY}
    networks:
      - foundry
    # Deliberately no depends_on for lavalink. It takes ~a minute to boot while it
    # resolves plugins, and the music service connects lazily on first use, so
    # gating the whole bot on it would delay temp_vc and chat_events for nothing.
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  discord-event:
    build: ./discord-event
    restart: unless-stopped
    logging: *default-logging
    environment:
      DISCORD_TOKEN: ${DISCORD_EVENT_TOKEN}
      GUILD_ID: ${GUILD_ID}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      STAFF_ROLE_ID: ${STAFF_ROLE_ID}
      SENIOR_STAFF_ROLE_ID: ${SENIOR_STAFF_ROLE_ID}
      OWNER_ROLE_ID: ${OWNER_ROLE_ID}
    networks:
      - foundry
    depends_on:
      mongodb:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────────────

  web-app:
    build:
      context: ./web-app
      args:
        BUN_PUBLIC_API_URL: ${API_BACKEND_URL}
    restart: unless-stopped
    logging: *default-logging
    environment:
      BUN_PUBLIC_API_URL: ${API_BACKEND_URL}
      INTERNAL_API_URL: http://api-backend:8000
    networks:
      - foundry

volumes:
  mongodb_data:
  postgres_data:
  uploads_data:

networks:
  foundry:
    driver: bridge
