# Shared log-rotation policy. Without it every container uses the default
# json-file driver with no cap, so stdout grows unbounded and eventually
# fills the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Infrastructure ──────────────────────────────────────────────────

  mongodb:
    image: mongo:8
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - mongodb_data:/data/db
    networks:
      - foundry
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-foundry}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
        - "127.0.0.1:5432:5432"
    networks:
      - foundry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-foundry}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - foundry
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  cache-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${CACHE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CACHE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CACHE_POSTGRES_DB:-osrs_cache}
    volumes:
      - cache_postgres_data:/var/lib/postgresql/data
    networks:
      - foundry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CACHE_POSTGRES_USER} -d ${CACHE_POSTGRES_DB:-osrs_cache}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend ─────────────────────────────────────────────────────────

  api-backend:
    build: ./api-backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      VALKEY_URI: ${VALKEY_URI}
      WOM_GROUP_ID: ${WOM_GROUP_ID:-}
      WOM_API_KEY: ${WOM_API_KEY:-}
      WOM_GROUP_KEY: ${WOM_GROUP_KEY:-}
      WOM_CLAN_NAME: ${WOM_CLAN_NAME:-Iron Foundry}
      WOM_DISCORD_CONTACT: ${WOM_DISCORD_CONTACT:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      GUILD_ID: ${GUILD_ID}
      DISCORD_TOKEN: ${DISCORD_SERVER_TOKEN}
      DISCORD_SERVER_TOKEN: ${DISCORD_SERVER_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-foundry}
      DISCORD_PARTY_WEBHOOK_URL: ${DISCORD_PARTY_WEBHOOK_URL:-}
      IRONCLAD_WEBHOOK_URL: ${IRONCLAD_WEBHOOK_URL:-}
      METRICS_API_KEY: ${METRICS_API_KEY}
      OSRS_CACHE_SERVICE_URL: http://osrs-cache-service:8100
      API_BACKEND_URL: ${API_BACKEND_URL}
      MAP_TILES_BASE_URL: ${MAP_TILES_BASE_URL:-}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - foundry
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  osrs-cache-service:
    build: ./osrs-cache-service
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+asyncpg://${CACHE_POSTGRES_USER}:${CACHE_POSTGRES_PASSWORD}@cache-postgres:5432/${CACHE_POSTGRES_DB:-osrs_cache}
      OPENRS2_BASE_URL: ${OPENRS2_BASE_URL:-https://archive.openrs2.org}
      CACHE_SYNC_INTERVAL_HOURS: ${CACHE_SYNC_INTERVAL_HOURS:-0.5}
      SPRITES_DIR: /data/sprites
      ICONS_DIR: /data/icons
      RENDERS_DIR: /data/renders
      MAPS_DIR: /data/maps
      RENDER_CACHE_TTL_DAYS: ${RENDER_CACHE_TTL_DAYS:-3}
    volumes:
      - cache_sprites_data:/data/sprites
      - cache_icons_data:/data/icons
      - cache_renders_data:/data/renders
      - cache_maps_data:/data/maps
    networks:
      - foundry
    depends_on:
      cache-postgres:
        condition: service_healthy

  # Static server for baked map tiles - keeps the high-volume tile traffic off the
  # single-worker cache-service app. Tiles are immutable public files.
  cache-tiles:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - cache_maps_data:/usr/share/nginx/html/map:ro
      - ./osrs-cache-service/deploy/tiles.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - foundry
    depends_on:
      - osrs-cache-service

  # ── Discord bots ─────────────────────────────────────────────────────

  discord-server:
    build: ./discord-server
    restart: unless-stopped
    logging: *default-logging
    environment:
      DISCORD_TOKEN: ${DISCORD_SERVER_TOKEN}
      GUILD_ID: ${GUILD_ID}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-foundry}
      VALKEY_URI: ${VALKEY_URI}
      STAFF_ROLE_ID: ${STAFF_ROLE_ID}
      SENIOR_STAFF_ROLE_ID: ${SENIOR_STAFF_ROLE_ID}
      OWNER_ROLE_ID: ${OWNER_ROLE_ID}
      MENTOR_ROLE_ID: ${MENTOR_ROLE_ID}
      FRONTEND_URL: ${FRONTEND_URL}
      UPLOADTHING_SECRET: ${UPLOADTHING_SECRET:-}
      API_BACKEND_URL: http://api-backend:8000
      METRICS_API_KEY: ${METRICS_API_KEY}
    networks:
      - foundry
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  discord-utils:
    build: ./discord-utils
    restart: unless-stopped
    logging: *default-logging
    environment:
      DISCORD_TOKEN: ${DISCORD_UTILS_TOKEN}
      GUILD_ID: ${GUILD_ID}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-foundry}
      VALKEY_URI: ${VALKEY_URI}
      STAFF_ROLE_ID: ${STAFF_ROLE_ID}
      SENIOR_STAFF_ROLE_ID: ${SENIOR_STAFF_ROLE_ID}
    networks:
      - foundry
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  discord-event:
    build: ./discord-event
    restart: unless-stopped
    logging: *default-logging
    environment:
      DISCORD_TOKEN: ${DISCORD_EVENT_TOKEN}
      GUILD_ID: ${GUILD_ID}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      STAFF_ROLE_ID: ${STAFF_ROLE_ID}
      SENIOR_STAFF_ROLE_ID: ${SENIOR_STAFF_ROLE_ID}
      OWNER_ROLE_ID: ${OWNER_ROLE_ID}
    networks:
      - foundry
    depends_on:
      mongodb:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────────────

  web-app:
    build:
      context: ./web-app
      args:
        BUN_PUBLIC_API_URL: ${API_BACKEND_URL}
    restart: unless-stopped
    logging: *default-logging
    environment:
      BUN_PUBLIC_API_URL: ${API_BACKEND_URL}
      INTERNAL_API_URL: http://api-backend:8000
    networks:
      - foundry

volumes:
  mongodb_data:
  postgres_data:
  uploads_data:
  cache_postgres_data:
  cache_sprites_data:
  cache_icons_data:
  cache_renders_data:
  cache_maps_data:

networks:
  foundry:
    driver: bridge
