<style>
:root{--ground:#e9e5db;--panel:#f3f0e8;--ink:#23262e;--muted:#5f6157;--faint:#8a8b7f;--rule:#d3cebf;--accent:#9c661f;--shadow:0 1px 2px rgba(40,36,24,.08),0 12px 40px rgba(40,36,24,.12);--mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif;}
@media (prefers-color-scheme:dark){:root{--ground:#15171d;--panel:#1c1f27;--ink:#e7e4da;--muted:#a2a494;--faint:#6f7166;--rule:#2c3039;--accent:#d69a4a;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.5);}}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;}
header{padding:.6rem 1rem;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:1rem;flex-wrap:wrap;background:var(--panel);}
header h1{font-family:Georgia,serif;font-size:1.05rem;margin:0;font-weight:700;}
header .sub{font-family:var(--mono);font-size:.72rem;color:var(--faint);}
.spacer{flex:1;}
.group{display:flex;gap:.3rem;align-items:center;}
button{font-family:var(--sans);font-size:.8rem;padding:.3rem .6rem;border:1px solid var(--rule);background:var(--ground);color:var(--ink);border-radius:6px;cursor:pointer;transition:background .12s,border-color .12s;}
button:hover{border-color:var(--accent);}
button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
select{font-family:var(--sans);font-size:.8rem;padding:.3rem .5rem;border:1px solid var(--rule);background:var(--ground);color:var(--ink);border-radius:6px;cursor:pointer;max-width:12rem;}
.label{font-family:var(--mono);font-size:.7rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-right:.2rem;}
#stage{flex:1;position:relative;overflow:hidden;background:#0d0f13;cursor:grab;}
#stage.drag{cursor:grabbing;}
canvas{position:absolute;inset:0;image-rendering:pixelated;}
#hud{position:absolute;top:.6rem;left:.6rem;font-family:var(--mono);font-size:.74rem;color:var(--ink);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--rule);border-radius:6px;padding:.4rem .6rem;pointer-events:none;line-height:1.5;box-shadow:var(--shadow);}
#hud b{color:var(--accent);}
.zoomctl{position:absolute;bottom:.8rem;right:.8rem;display:flex;flex-direction:column;gap:.3rem;}
.zoomctl button{width:2rem;height:2rem;font-size:1.1rem;line-height:1;box-shadow:var(--shadow);}
.hint{position:absolute;bottom:.8rem;left:.8rem;font-family:var(--mono);font-size:.68rem;color:var(--faint);pointer-events:none;}
</style>
</head>

10467,0,"Grimstone<br>Dungeon",16777215],[2507,7841,0,"Castle<br>Drakan",16777215],[2596,7840,0,"Sangvesti",16777215],[2771,7832,0,"Sotfa<br>Forest",16777215],[2710,7853,0,"Ruined<br>Village",16777215],[2597,7777,0,"Apsul<br>Hunting<br>Ground",16777215],[2509,7758,0,"Virer<br>Hunting<br>Ground",16777215]];

let showSprites = false, showLabels = false;

const M = MANIFEST;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
const hud = document.getElementById("hud");

// ---- Coordinate math (XYZ, driven off the manifest) ----------------------
const ppt = z => M.pixelsPerTile[z - M.minZoom];
const gtpt = z => M.tileSize / ppt(z);
const tilesAxis = z => M.worldTiles / gtpt(z);
function zoomFromScale(scale){
  const p0 = ppt(M.minZoom);
  const raw = Math.round(Math.log2(scale) - Math.log2(p0)) + M.minZoom;
  return Math.max(M.minZoom, Math.min(M.maxZoom, raw));
}
const tileUrl = (plane,z,x,y) => TILE_BASE + M.tileUrl
  .replace("{plane}",plane).replace("{z}",z).replace("{x}",x).replace("{y}",y);

// ---- Coverage bitmap -----------------------------------------------------
const COV = M.coverage;
function b64(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
const planeBits = COV ? COV.planeBits.map(b64) : null;
function regionCovered(plane,rx,ry){
  if(!planeBits) return true;
  const bits = planeBits[plane]; if(!bits) return false;
  const col = rx - COV.regionMinX, row = ry - COV.regionMinY;
  if(col<0||row<0||col>=COV.regionWidth||row>=COV.regionHeight) return false;
  const bit = row*COV.regionWidth + col;
  return (bits[bit>>3] & (1<<(bit&7))) !== 0;
}
function tileCovered(z,plane,tx,ty){
  const g=gtpt(z), axis=tilesAxis(z), size=M.regionSize;
  const x0=tx*g, y0=(axis-1-ty)*g;
  const rxMin=Math.floor(x0/size), rxMax=Math.floor((x0+g-1)/size);
  const ryMin=Math.floor(y0/size), ryMax=Math.floor((y0+g-1)/size);
  for(let rx=rxMin;rx<=rxMax;rx++)
    for(let ry=ryMin;ry<=ryMax;ry++)
      if(regionCovered(plane,rx,ry)) return true;
  return false;
}
function visibleTiles(cx,cy,scale,W,H,plane){
  const z=zoomFromScale(scale), g=gtpt(z), axis=tilesAxis(z);
  const halfW=W/2/scale, halfH=H/2/scale;
  const txMin=Math.floor((cx-halfW)/g), txMax=Math.floor((cx+halfW)/g);
  const tyMin=axis-1-Math.floor((cy+halfH)/g), tyMax=axis-1-Math.floor((cy-halfH)/g);
  const out=[], disp=g*scale;
  for(let tx=txMin;tx<=txMax;tx++){
    if(tx<0||tx>=axis) continue;
    for(let ty=tyMin;ty<=tyMax;ty++){
      if(ty<0||ty>=axis) continue;
      if(COV && !tileCovered(z,plane,tx,ty)) continue;
      out.push({tx,ty,z,
        sx: W/2 + (tx*g - cx)*scale,
        sy: H/2 - ((axis-ty)*g - cy)*scale,
        size: disp});
    }
  }
  return out;
}

// ---- Tile cache (Image) --------------------------------------------------
const cache = new Map();
function getTile(url){
  let img = cache.get(url);
  if(img){ cache.delete(url); cache.set(url,img); return img; }
  img = new Image();
  img.decoding = "async";
  img.onload = () => { img.ok = true; schedule(); };
  img.onerror = () => { img.err = true; };
  img.src = url;
  cache.set(url,img);
  if(cache.size > 1800){ const k=cache.keys().next().value; cache.delete(k); }
  return img;
}

// ---- Overlays: sprites (map icons) + city labels -------------------------
const spriteCache = new Map();
function getSprite(id){
  let img = spriteCache.get(id);
  if(img) return img;
  img = new Image();
  img.onload = () => { img.ok = true; schedule(); };
  img.onerror = () => { img.err = true; };
  img.src = TILE_BASE + "/sprites/" + id + "/0?format=png";
  spriteCache.set(id, img);
  return img;
}
// On the overview layer, labels use the surface (plane 0) set.
const surfacePlane = () => (plane === M.overviewPlane ? 0 : plane);
function drawSprites(W,H){
  const overview = (plane === M.overviewPlane);
  const list = overview ? OVERVIEW_ICONS : ICONS;
  for(const [x,y,p,sid] of list){
    if(!overview && p !== plane) continue;
    const sx = W/2 + (x-cx)*scale, sy = H/2 - (y-cy)*scale;
    if(sx<-24||sx>W+24||sy<-24||sy>H+24) continue;
    const img = getSprite(sid);
    if(!img.ok) continue;
    const w = img.naturalWidth||15, h = img.naturalHeight||15;
    ctx.drawImage(img, Math.round(sx-w/2), Math.round(sy-h/2), w, h);
  }
}
function drawLabels(W,H){
  if(scale < 1) return;               // too zoomed out to read
  const sp = surfacePlane();
  ctx.save();
  ctx.font = "600 12px system-ui,-apple-system,'Segoe UI',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const LH = 13;
  for(const [x,y,p,text,color] of LABELS){
    if(p !== sp) continue;
    const px = W/2 + (x-cx)*scale, py = H/2 - (y-cy)*scale;
    if(px<-60||px>W+60||py<0||py>H) continue;
    const lines = text.split("<br>");
    const tw = Math.max(...lines.map(l=>ctx.measureText(l).width));
    const bh = lines.length*LH;
    ctx.fillStyle = "rgba(12,14,19,.6)";
    ctx.fillRect(px-tw/2-3, py-bh/2-1, tw+6, bh+2);
    ctx.fillStyle = "#" + ((color>>>0)&0xFFFFFF).toString(16).padStart(6,"0");
    lines.forEach((l,i)=>ctx.fillText(l, px, py - bh/2 + LH/2 + i*LH));
  }
  ctx.restore();
}

// ---- View state ----------------------------------------------------------
const B = M.bounds;
const start = { x:3222, y:3218 };
let cx = start.x, cy = start.y, scale = 4, plane = (M.overviewPlane ?? 0);
const SCALE_MIN = ppt(M.minZoom), SCALE_MAX = ppt(M.maxZoom)*4;

function clampView(){
  if(B){ cx=Math.max(B.minX,Math.min(B.maxX,cx)); cy=Math.max(B.minY,Math.min(B.maxY,cy)); }
  scale=Math.max(SCALE_MIN,Math.min(SCALE_MAX,scale));
}

// ---- Render --------------------------------------------------------------
let raf=null;
function schedule(){ if(raf==null) raf=requestAnimationFrame(draw); }
function draw(){
  raf=null;
  const dpr=window.devicePixelRatio||1;
  const W=stage.clientWidth, H=stage.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  clampView();
  const tiles=visibleTiles(cx,cy,scale,W,H,plane);
  for(const t of tiles){
    const img=getTile(tileUrl(plane,t.z,t.tx,t.ty));
    if(img.ok){ ctx.drawImage(img,t.sx,t.sy,t.size,t.size); continue; }
    // one-to-three level ancestor fallback for progressive refinement
    for(let up=1;up<=3;up++){
      const pz=t.z-up; if(pz<M.minZoom) break;
      const ptx=t.tx>>up, pty=t.ty>>up;
      const a=cache.get(tileUrl(plane,pz,ptx,pty));
      if(a&&a.ok){
        const frac=1<<up, sub=M.tileSize/frac;
        const sxi=(t.tx-(ptx<<up))*sub, syi=(t.ty-(pty<<up))*sub;
        ctx.drawImage(a,sxi,syi,sub,sub,t.sx,t.sy,t.size,t.size);
        break;
      }
    }
  }
  if(showSprites) drawSprites(W,H);
  if(showLabels) drawLabels(W,H);
  hud.innerHTML = `X <b>${Math.round(cx)}</b> &nbsp; Y <b>${Math.round(cy)}</b> &nbsp; plane <b>${plane}</b> &nbsp; z <b>${zoomFromScale(scale)}</b> &nbsp; <span style="color:var(--faint)">${scale.toFixed(2)} px/tile</span>`;
}

// ---- Interaction ---------------------------------------------------------
let drag=null;
stage.addEventListener("pointerdown",e=>{
  if(e.button!==0) return;
  stage.setPointerCapture(e.pointerId); stage.classList.add("drag");
  drag={ x:e.clientX, y:e.clientY, cx, cy };
});
stage.addEventListener("pointermove",e=>{
  if(!drag) return;
  cx = drag.cx - (e.clientX-drag.x)/scale;
  cy = drag.cy + (e.clientY-drag.y)/scale;
  schedule();
});
function endDrag(e){ drag=null; stage.classList.remove("drag"); }
stage.addEventListener("pointerup",endDrag);
stage.addEventListener("pointercancel",endDrag);
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  const px=e.clientX-r.left, py=e.clientY-r.top;
  const W=stage.clientWidth, H=stage.clientHeight;
  const wx=cx+(px-W/2)/scale, wy=cy-(py-H/2)/scale;
  const next=Math.max(SCALE_MIN,Math.min(SCALE_MAX,scale*(1-e.deltaY*0.0015)));
  cx=wx-(px-W/2)/next; cy=wy+(py-H/2)/next; scale=next;
  schedule();
},{passive:false});

function zoomStep(f){
  const W=stage.clientWidth,H=stage.clientHeight;
  const wx=cx, wy=cy;
  scale=Math.max(SCALE_MIN,Math.min(SCALE_MAX,scale*f));
  cx=wx; cy=wy; schedule();
}
document.getElementById("zin").onclick=()=>zoomStep(1.5);
document.getElementById("zout").onclick=()=>zoomStep(1/1.5);
document.getElementById("reset").onclick=()=>{ cx=start.x; cy=start.y; scale=4; schedule(); };

// jump buttons
document.querySelectorAll("header button[data-x]").forEach(b=>{
  b.onclick=()=>{ cx=+b.dataset.x; cy=+b.dataset.y; scale=Math.max(scale,4); schedule(); };
});

// layer toggles
const tSprites=document.getElementById("tSprites"), tLabels=document.getElementById("tLabels");
tSprites.onclick=()=>{ showSprites=!showSprites; tSprites.classList.toggle("on",showSprites); schedule(); };
tLabels.onclick=()=>{ showLabels=!showLabels; tLabels.classList.toggle("on",showLabels); schedule(); };

// plane switcher (0..3 plus the composited overview)
const planesEl=document.getElementById("planes");
const planeOpts=[];
for(let p=0;p<M.planes;p++) planeOpts.push([String(p),p]);
if(M.overviewPlane!=null) planeOpts.push(["Map",M.overviewPlane]);
function setPlane(p){ plane=p; [...planesEl.children].forEach(c=>c.classList.toggle("on",+c.dataset.plane===p)); schedule(); }
for(const [label,p] of planeOpts){
  const b=document.createElement("button");
  b.textContent=label; b.dataset.plane=p; if(p===plane) b.classList.add("on");
  b.onclick=()=>setPlane(p);
  planesEl.appendChild(b);
}
// section jump dropdown
const sectionEl=document.getElementById("section");
sectionEl.appendChild(new Option("Jump to section…",""));
for(const [id,name,x,y,p] of SECTIONS){
  const o=new Option(name,id); o.dataset.x=x; o.dataset.y=y; o.dataset.p=p;
  sectionEl.appendChild(o);
}
sectionEl.onchange=()=>{
  const o=sectionEl.selectedOptions[0];
  if(!o.value) return;
  cx=+o.dataset.x; cy=+o.dataset.y;
  const p=+o.dataset.p;
  if(M.overviewPlane!=null && p===0) setPlane(M.overviewPlane); else setPlane(p);
  scale=Math.max(scale,4); schedule();
};

document.getElementById("buildlabel").textContent=`build ${M.build} · cache 2620 · ${TILE_BASE}`;

new ResizeObserver(schedule).observe(stage);
schedule();
</script>
