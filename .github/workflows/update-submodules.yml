name: Update submodule reference

on:
  repository_dispatch:
    types: [submodule-updated]
  workflow_dispatch:
    inputs:
      submodule:
        description: "Submodule directory name (e.g. discord-server)"
        required: false

permissions:
  contents: read

# One queue per submodule. A single shared group is wrong here: GitHub keeps
# only the newest pending run in a group and cancels the others, so five
# submodules pushing at once silently lost three of their pointer updates.
# Races between the queues are handled by the retry loop below instead.
concurrency:
  group: update-submodules-${{ github.event.client_payload.submodule || inputs.submodule || 'all' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}
          submodules: true

      - name: Advance submodule pointer and push
        env:
          SUB_RAW: ${{ github.event.client_payload.submodule || inputs.submodule }}
        run: |
          set -euo pipefail

          if [ -n "${SUB_RAW}" ]; then
            case "$SUB_RAW" in
              *[!a-zA-Z0-9_-]*) echo "Invalid submodule name: $SUB_RAW"; exit 1 ;;
            esac
            LABEL="$SUB_RAW"
          else
            LABEL="submodules"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Another submodule's run can land between our checkout and our push,
          # which is what "! [rejected] (fetch first)" was. Rebuild the pointer
          # commit on the current tip and retry rather than failing the run.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            if [ -n "${SUB_RAW}" ]; then
              git submodule update --init --remote -- "$SUB_RAW"
              git add -- "$SUB_RAW"
            else
              git submodule update --init --remote
              git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
                | awk '{print $2}' | xargs -r git add --
            fi

            if git diff --staged --quiet; then
              echo "No pointer change for ${LABEL}"
              exit 0
            fi

            git commit --quiet -m "chore: update ${LABEL} submodule reference"

            if git push --quiet origin HEAD:main; then
              echo "Pushed ${LABEL} pointer on attempt ${attempt}"
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}); another run got there first, retrying"
            sleep $((attempt * 3))
          done

          echo "Could not push the ${LABEL} pointer after 5 attempts"
          exit 1
