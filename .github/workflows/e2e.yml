name: End-to-end integration

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# A batch of submodule pointer commits pushes to main several times in a row,
# and each push started its own full-stack run. Superseded runs test a tip that
# no longer exists, so the newest one cancels them.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # run-tests.sh calls `playwright install chromium` without --with-deps;
      # the runner needs the system libraries that flag pulls in.
      - name: Install Playwright system dependencies
        working-directory: integration/e2e
        run: |
          bun install
          bunx playwright install --with-deps chromium

      - name: Full stack E2E
        run: bash run-tests.sh e2e
