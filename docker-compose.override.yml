# Automatically loaded by `docker compose up` for local development.
# Exposes service ports directly to the host.

services:
  api-backend:
    ports:
      - "8000:8000"
    environment:
      # Dev: the browser reaches map tiles via the cache-tiles nginx sidecar on
      # its host-exposed port, mirroring prod (Python off the tile hot path).
      MAP_TILES_BASE_URL: http://localhost:8101

  web-app:
    ports:
      - "3000:3000"

  osrs-cache-service:
    ports:
      - "8100:8100"

  cache-tiles:
    ports:
      - "8101:80"

  # Lets discord-utils run on the host against the containerised audio node.
  lavalink:
    ports:
      - "127.0.0.1:2333:2333"
