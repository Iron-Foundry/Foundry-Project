name: Update submodule reference

on:
  repository_dispatch:
    types: [submodule-updated]
  workflow_dispatch:
    inputs:
      submodule:
        description: "Submodule directory name (e.g. discord-server)"
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}
          submodules: true

      - name: Advance submodule pointer
        env:
          SUB_RAW: ${{ github.event.client_payload.submodule || inputs.submodule }}
        run: |
          if [ -n "$SUB_RAW" ]; then
            case "$SUB_RAW" in
              *[!a-zA-Z0-9_-]*) echo "Invalid submodule name: $SUB_RAW"; exit 1 ;;
            esac
            git submodule update --remote -- "$SUB_RAW"
          else
            git submodule update --remote
          fi

      - name: Commit and push (if changed)
        env:
          SUB_RAW: ${{ github.event.client_payload.submodule || inputs.submodule }}
        run: |
          git config user.name  "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.codeberg.org"
          git add .
          git diff --staged --quiet && echo "No changes" && exit 0
          if [ -n "$SUB_RAW" ]; then
            case "$SUB_RAW" in
              *[!a-zA-Z0-9_-]*) echo "Invalid submodule name: $SUB_RAW"; exit 1 ;;
            esac
            LABEL="$SUB_RAW"
          else
            LABEL="submodules"
          fi
          git commit -m "chore: update ${LABEL} submodule reference"
          git push
