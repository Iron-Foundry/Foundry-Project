# Serves baked map tiles straight off the maps volume, keeping high-volume tile
# traffic off the single-worker cache-service app. Tiles are immutable, so they are
# cached hard and never revalidated; a missing tile is a plain 404 (sparse world).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # /map/<build>/<plane>/<z>/<x>/<y>.webp
    location /map/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Tiles are fetched directly from this origin (bypassing api-backend), so
        # the client's fetch() needs CORS. They are public, immutable and carry no
        # credentials, so a wildcard origin is safe. In prod tiles are same-origin
        # (api.<domain>/map/*) and this header is simply ignored.
        add_header Access-Control-Allow-Origin "*" always;
        types { image/webp webp; }
        default_type application/octet-stream;
        try_files $uri =404;
        access_log off;
    }

    # WebP is already compressed; do not spend CPU gzipping it.
    gzip off;
}
