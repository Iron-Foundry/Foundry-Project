# Traefik routing overlay - use on top of the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#
# Requires a running Traefik instance attached to the traefik-shared network.

services:
  api-backend:
    environment:
      # Prod: tiles are served by the cache-tiles sidecar, routed below at
      # api.<domain>/map/*. The manifest's relative tileUrl is rewritten onto this.
      MAP_TILES_BASE_URL: "https://api.${DOMAIN}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.api-backend.rule: "Host(`api.${DOMAIN}`)"
      traefik.http.routers.api-backend.entrypoints: websecure
      traefik.http.routers.api-backend.tls.certresolver: cloudflare
      traefik.http.services.api-backend.loadbalancer.server.port: "8000"
    networks:
      traefik-shared:

  # Baked map tiles: served straight off the volume by the nginx sidecar, never
  # through the single-worker cache app. A path rule on the same api host wins over
  # api-backend's host-only rule, so api.<domain>/map/* lands here.
  cache-tiles:
    labels:
      traefik.enable: "true"
      traefik.http.routers.cache-tiles.rule: "Host(`api.${DOMAIN}`) && PathPrefix(`/map/`)"
      traefik.http.routers.cache-tiles.priority: "100"
      traefik.http.routers.cache-tiles.entrypoints: websecure
      traefik.http.routers.cache-tiles.tls.certresolver: cloudflare
      traefik.http.services.cache-tiles.loadbalancer.server.port: "80"
    networks:
      traefik-shared:

  web-app:
    labels:
      traefik.enable: "true"
      traefik.http.routers.web-app.rule: "Host(`${DOMAIN}`)"
      traefik.http.routers.web-app.entrypoints: websecure
      traefik.http.routers.web-app.tls.certresolver: cloudflare
      traefik.http.services.web-app.loadbalancer.server.port: "3000"
    networks:
      traefik-shared:

  postgres:
    labels:
      traefik.enable: "true"
      traefik.tcp.routers.postgres.rule: "HostSNI(`*`)"
      traefik.tcp.routers.postgres.entrypoints: postgres
      traefik.tcp.routers.postgres.service: postgres
      traefik.tcp.services.postgres.loadbalancer.server.port: "5432"
    networks:
      traefik-shared:

networks:
  traefik-shared:
    external: true
