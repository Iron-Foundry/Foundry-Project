# Self-contained end-to-end stack for cross-service integration tests.
# Brings up Postgres + Valkey + api-backend + web-app with throwaway test
# credentials, exposing api (8000), web (3000) and postgres (5432) to the host
# so the Playwright (web -> api -> DB) and discord_e2e (discord -> api,
# api -> runelite) suites can drive the running stack.
#
#   docker compose -f integration/docker-compose.e2e.yml up --build -d
#
# The api-backend image applies Alembic migrations on boot (see its Dockerfile),
# so the schema is ready without a separate migrate step.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    ports:
      - "127.0.0.1:5432:5432"
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry -d foundry"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    # Exposed to the host so the music suite can seed a session and watch the
    # command channel, which is what discord-utils would otherwise be doing.
    ports:
      - "127.0.0.1:6379:6379"
    networks: [e2e]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-backend:
    build: ../api-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://foundry:foundry@postgres:5432/foundry
      VALKEY_URI: redis://valkey:6379
      # 127.0.0.1 rather than localhost throughout: the host-side suites connect
      # over the IPv4 loopback the ports are published on, and these values have
      # to match theirs or CORS and the OAuth redirect stop lining up.
      FRONTEND_URL: http://127.0.0.1:3000
      JWT_SECRET: e2e-test-secret-e2e-test-secret-01
      METRICS_API_KEY: e2e-metrics-key
      DISCORD_CLIENT_ID: e2e
      DISCORD_CLIENT_SECRET: e2e
      DISCORD_REDIRECT_URI: http://127.0.0.1:3000/auth/callback
      GUILD_ID: "1"
      DISCORD_SERVER_TOKEN: e2e
      API_BACKEND_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  web-app:
    build:
      context: ../web-app
      args:
        BUN_PUBLIC_API_URL: http://127.0.0.1:8000
    environment:
      BUN_PUBLIC_API_URL: http://127.0.0.1:8000
      INTERNAL_API_URL: http://api-backend:8000
      SITE_URL: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    networks: [e2e]
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://localhost:3000/')"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      api-backend:
        condition: service_healthy

networks:
  e2e:
    driver: bridge
